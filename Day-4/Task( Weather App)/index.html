<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether — Weather</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Ambient background layers -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
  <canvas id="particle-canvas"></canvas>

  <div class="app-shell">

    <!-- Search Bar -->
    <header class="search-header">
      <div class="logo">⬡ Aether</div>
      <div class="search-wrap">
        <input id="city-input" type="text" placeholder="Search city…" autocomplete="off" />
        <button id="search-btn" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button id="geo-btn" aria-label="Use my location">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2a7 7 0 0 1 7 7c0 5.25-7 13-7 13S5 14.25 5 9a7 7 0 0 1 7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        </button>
      </div>
    </header>

    <!-- Error state -->
    <div id="error-box" class="error-box hidden">
      <span id="error-msg"></span>
    </div>

    <!-- Loading skeleton -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Reading the atmosphere…</p>
    </div>

    <!-- Main weather display -->
    <main id="weather-main" class="weather-main hidden">

      <!-- Hero -->
      <section class="hero-card" id="hero-card">
        <div class="hero-left">
          <div class="city-label">
            <span id="city-name">—</span>
            <span id="country-code"></span>
          </div>
          <div class="local-time" id="local-time"></div>
          <div class="temp-display">
            <span id="main-temp">—</span>
            <sup class="unit">°C</sup>
          </div>
          <div class="feels-like">Feels like <span id="feels-like">—</span>°C</div>
          <div class="condition-pill" id="condition-pill">—</div>
        </div>
        <div class="hero-right">
          <div class="weather-icon-wrap">
            <img id="weather-icon" src="" alt="weather icon" />
            <div class="icon-glow" id="icon-glow"></div>
          </div>
          <div class="temp-range">
            <span class="range-hi">↑ <span id="temp-max">—</span>°</span>
            <span class="range-lo">↓ <span id="temp-min">—</span>°</span>
          </div>
        </div>
      </section>

      <!-- Stats grid -->
      <section class="stats-grid">
        <div class="stat-card" id="s-humidity">
          <div class="stat-icon">💧</div>
          <div class="stat-value" id="humidity">—</div>
          <div class="stat-label">Humidity</div>
          <div class="stat-bar"><div class="stat-bar-fill" id="humidity-bar"></div></div>
        </div>
        <div class="stat-card" id="s-wind">
          <div class="stat-icon">🌬</div>
          <div class="stat-value"><span id="wind-speed">—</span> <small>km/h</small></div>
          <div class="stat-label">Wind</div>
          <div class="wind-dir-wrap">
            <div class="wind-compass">
              <div class="wind-needle" id="wind-needle"></div>
            </div>
            <span id="wind-dir">—</span>
          </div>
        </div>
        <div class="stat-card" id="s-pressure">
          <div class="stat-icon">🌡</div>
          <div class="stat-value"><span id="pressure">—</span> <small>hPa</small></div>
          <div class="stat-label">Pressure</div>
          <div class="pressure-arc-wrap">
            <svg class="pressure-arc" viewBox="0 0 80 50">
              <path d="M10 45 A35 35 0 0 1 70 45" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="5" stroke-linecap="round"/>
              <path id="pressure-arc-fill" d="M10 45 A35 35 0 0 1 70 45" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="110" stroke-dashoffset="110"/>
            </svg>
          </div>
        </div>
        <div class="stat-card" id="s-visibility">
          <div class="stat-icon">👁</div>
          <div class="stat-value"><span id="visibility">—</span> <small>km</small></div>
          <div class="stat-label">Visibility</div>
        </div>
        <div class="stat-card" id="s-uv">
          <div class="stat-icon">☀️</div>
          <div class="stat-value"><span id="cloudiness">—</span><small>%</small></div>
          <div class="stat-label">Cloud Cover</div>
        </div>
        <div class="stat-card" id="s-dew">
          <div class="stat-icon">🌊</div>
          <div class="stat-value"><span id="sea-level">—</span><small> hPa</small></div>
          <div class="stat-label">Sea Level</div>
        </div>
      </section>

      <!-- Sun times -->
      <section class="sun-section">
        <div class="sun-card sunrise">
          <div class="sun-icon">🌅</div>
          <div class="sun-time" id="sunrise">—</div>
          <div class="sun-label">Sunrise</div>
        </div>
        <div class="sun-arc-wrap">
          <svg class="sun-arc-svg" viewBox="0 0 200 100" preserveAspectRatio="none">
            <defs>
              <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#f97316"/>
                <stop offset="50%" style="stop-color:#facc15"/>
                <stop offset="100%" style="stop-color:#fb923c"/>
              </linearGradient>
            </defs>
            <path d="M10 90 Q100 10 190 90" fill="none" stroke="url(#arcGrad)" stroke-width="2.5" stroke-dasharray="220" stroke-dashoffset="220" id="sun-arc-path"/>
            <circle id="sun-dot" cx="10" cy="90" r="5" fill="#facc15"/>
          </svg>
          <div class="daylight-label" id="daylight-label">—h daylight</div>
        </div>
        <div class="sun-card sunset">
          <div class="sun-icon">🌇</div>
          <div class="sun-time" id="sunset">—</div>
          <div class="sun-label">Sunset</div>
        </div>
      </section>

      <!-- Forecast -->
      <section class="forecast-section">
        <h2 class="section-title">5-Day Forecast</h2>
        <div id="forecast-strip" class="forecast-strip">
          <!-- injected by JS -->
        </div>
      </section>

      <!-- Location -->
      <section class="coord-section">
        <div class="coord-item">🗺 <span id="lat-lon">—</span></div>
        <div class="coord-item">🕐 <span id="timezone">—</span></div>
      </section>

    </main>

    <!-- Empty state -->
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">🌍</div>
      <p>Search a city or use your location to see live weather.</p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
